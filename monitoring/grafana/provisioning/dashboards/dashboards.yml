# Author: Cryzal & Midhul
# Tells Grafana to load any dashboard JSON found in the mounted folder
# below on startup, so the router dashboard shows up without any manual
# import step.
apiVersion: 1

providers:
  - name: agentic-cost-router
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
