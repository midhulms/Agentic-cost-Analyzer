# Author: Cryzal
# Tells Prometheus where to scrape. In docker-compose, the API is reachable
# at the service name "api" on the internal network -- not "localhost".
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "agentic-cost-router"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
