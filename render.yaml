# Author: Midhul MS (Cryzal)
# Render Blueprint: lets Render read this file and configure the service
# automatically instead of filling in every field by hand in the dashboard.
# Docs: https://render.com/docs/infrastructure-as-code
#
# IMPORTANT. Data persistence on Render:
# app/config.py's db_path ("data/cost_router.db") is plain SQLite on local
# disk. Render's FREE plan gives the container NO persistent disk: every
# redeploy, and every cold-start after the service spins down from
# inactivity, wipes the filesystem and the DB resets to zero requests/
# agents. That is what was causing "no agents / no data" on the deployed
# app even though it worked locally. It's not a code bug, it's the free
# tier's storage model.
#
# To make data survive across deploys/restarts, do ONE of:
#   1) Upgrade this service to a paid instance type and attach a Render
#      Disk, then uncomment the `disk:` block below (mountPath must match
#      db_path's parent, i.e. /app/data).
#   2) Point db_path at an external database instead of local SQLite
#      (e.g. Render's own free-tier PostgreSQL, or Supabase/Turso). More
#      work, but survives forever regardless of plan/tier.
# On the free tier as configured below, resets are expected behavior.
services:
  - type: web
    name: agentic-cost-router
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: CHEAP_PROVIDER
        value: mock
      - key: FRONTIER_PROVIDER
        value: mock
      - key: COMPLEXITY_THRESHOLD
        value: "0.55"
    healthCheckPath: /health
    # disk:
    #   name: acr-data
    #   mountPath: /app/data
    #   sizeGB: 1
