# Author: Cryzal
# Render Blueprint: lets Render read this file and configure the service
# automatically instead of filling in every field by hand in the dashboard.
# Docs: https://render.com/docs/infrastructure-as-code
services:
  - type: web
    name: agentic-cost-router
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: CHEAP_PROVIDER
        value: mock
      - key: FRONTIER_PROVIDER
        value: mock
      - key: COMPLEXITY_THRESHOLD
        value: "0.55"
    healthCheckPath: /health
